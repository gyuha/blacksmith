<html lang="en">
<head>
<meta charset="utf-8">

<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #050505; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #ui { position: fixed; inset: 0; pointer-events: none; color: #cbb79a;
        font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif; }
  #title { position: absolute; left: 50%; top: 43%; transform: translate(-50%,-50%);
           text-align: center; letter-spacing: .38em; transition: opacity .9s; }
  #title h1 { margin: 0; font-size: 46px; font-weight: 400; color: #ecdcbc;
              text-shadow: 0 0 30px rgba(255,150,50,.30); }
  #title p  { margin: 15px 0 0; font-size: 12px; letter-spacing: .24em; color: #8d7a60; }
  #hint { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
          font-size: 11.5px; letter-spacing: .2em; color: #8a7861; opacity: .85; white-space: nowrap; }
  #corner { position: absolute; left: 20px; top: 18px; font-size: 13px; letter-spacing: .1em;

  #corner .coin { width: 11px; height: 11px; border-radius: 50%; display: inline-block;
                  background: radial-gradient(circle at 35% 30%, #ffd88a, #a9741f 70%, #5c3d0d);
                  box-shadow: 0 0 10px rgba(255,180,70,.5); margin-right: 7px; vertical-align: -1px; }
  #order, #heldTag { color: #e0cba6; opacity: .92; font-size: 12px; letter-spacing: .12em; }

  #gauge { position: absolute; left: 50%; top: 72%; width: 300px; height: 9px; margin-left: -150px;

  #gband { position: absolute; top: 0; bottom: 0; background: #39ff7a55; border: 1px solid #39ff7a; }
  #gcur { position: absolute; top: -4px; bottom: -4px; width: 2px; background: #fff0d0; box-shadow: 0 0 8px #ffd9a0; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<body>
<div id="ui">
  <div id="title"><h1>THE TEMPER</h1><p>take the order · heat · strike · deliver</p></div>
  <div id="corner"><span><i class="coin"></i><b id="gold">0</b></span><span id="order"></span><span id="heldTag"></span></div>
  <div id="cross"></div>
  <div id="prompt"></div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const Q = new URLSearchParams(location.search);
let seed = +(Q.get('seed') || 1);
const rand = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
for (let i = 0; i < 37; i++) rand();   // let a small seed settle before the first roll

const PAL = { haze: 0x0d0e0b };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const damp = (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt));

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(PAL.haze);
scene.fog = new THREE.FogExp2(PAL.haze, 0.03);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.05, 60);
scene.add(camera);

/* ---------- post: bloom, one grade, vignette, grain, slight fringing on the glow ---------- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.20, 0.40, 0.92));
const grade = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uVig: { value: 0.30 }, uGrain: { value: 0.004 },
              uCA: { value: 0.0005 }, uLift: { value: new THREE.Vector3(0.0095, 0.0065, 0.002) },
              uGain: { value: new THREE.Vector3(1.02, 1.0, 0.97) } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uTime,uVig,uGrain,uCA; uniform vec3 uLift,uGain; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)))*43758.5453); }
    void main(){
      vec2 d = vUv - .5; float r = length(d);
      vec2 off = d * uCA * (0.4 + r);
      vec3 c;
      c.r = texture2D(tDiffuse, vUv + off).r;
      c.g = texture2D(tDiffuse, vUv).g;
      c.b = texture2D(tDiffuse, vUv - off).b;
      c = c * uGain + uLift;
      float lum = dot(c, vec3(0.2126, 0.7152, 0.0722));
      c = mix(c, vec3(lum) * vec3(1.02, 1.0, 0.94), 0.10);
      c *= 1. - uVig * smoothstep(.28,.95,r*1.3);
      c += (h(vUv*1024. + fract(uTime)*91.) - .5) * uGrain * (0.6 + 0.3*(1.-dot(c,vec3(.33))));
      gl_FragColor = vec4(c,1.);
    }`,
});
composer.addPass(grade);
composer.addPass(new OutputPass());

/* ---------- lights (few: one shadowed key, fire, three warm fills) ---------- */
scene.add(new THREE.HemisphereLight(0x8a7e68, 0x2a241b, 1.9));
const keyLight = new THREE.SpotLight(0xffb877, 150, 14, 1.25, 0.85, 1.6);
keyLight.position.set(0, 3.1, 0.2);
keyLight.target.position.set(0, 0, 0);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
keyLight.shadow.bias = -0.0006;
keyLight.shadow.camera.near = 0.5; keyLight.shadow.camera.far = 10;
scene.add(keyLight, keyLight.target);

const fireLight = new THREE.PointLight(0xff7a20, 22, 9, 2.0);
fireLight.position.set(3.6, 1.0, 1.4);
scene.add(fireLight);
const northLamp = new THREE.PointLight(0xffc070, 26, 9, 2);
northLamp.position.set(0, 2.5, -2.0);
scene.add(northLamp);
const westLamp = new THREE.PointLight(0xffb070, 16, 7, 2);
westLamp.position.set(-3.4, 2.4, -0.8);
scene.add(westLamp);
const southLamp = new THREE.PointLight(0xffc98a, 12, 6, 2);
southLamp.position.set(0, 2.4, 2.4);
scene.add(southLamp);

/* ---------- models ---------- */
const gltfLoader = new GLTFLoader();
const MODELS = {};              // name -> placed Object3D
const loadErrors = [];
const MZ = 1;   // the GLBs face +z as exported; layout z maps straight onto glTF z
// the GLBs are centred on their own origin: seat each on the floor (y = 0)
function seat(obj) {
  obj.updateMatrixWorld(true);
  const bb = new THREE.Box3().setFromObject(obj);
  obj.position.y -= bb.min.y;
  obj.updateMatrixWorld(true);
}
function tame(obj) {
  obj.traverse(o => {
    if (!o.isMesh) return;
    o.castShadow = true; o.receiveShadow = true;
    const m = o.material;
    if (m && m.emissiveIntensity > 1.6) m.emissiveIntensity = 1.6;
  });
}
function loadRoom(name, [x, z], rotY = 0, cast = true) {
  return new Promise(res => {
    gltfLoader.load(`assets/models/${name}.glb`, g => {
      const wrap = new THREE.Group();            // wrapper holds the z-mirror
      const o = g.scene;
      wrap.scale.z = MZ;
      wrap.add(o);
      wrap.position.set(x, 0, z);
      wrap.rotation.y = rotY;
      scene.add(wrap);
      seat(wrap);
      tame(o);
      if (!cast) o.traverse(m => { if (m.isMesh) m.castShadow = false; });
      MODELS[name] = wrap;
      res(wrap);
    }, undefined, err => { loadErrors.push(name + ': ' + err.message); res(null); });
  });
}

/* ---------- layout: game coords, room centre origin, +x east, +z south ---------- */
const ZONES = {
  order:    { x: -1.6, z: -2.10, radius: 1.4, model: 'assets/models/room_order_window.glb' },
  exchange: { x:  1.6, z: -2.30, radius: 1.4, model: 'assets/models/room_exchange.glb' },
  craft:    { x:  3.2, z:  0.95, radius: 1.5, model: 'assets/models/room_anvil_bench.glb' },
  forge:    { x:  3.5, z:  1.45, radius: 1.2, model: 'assets/models/room_furnace.glb' },
  display:  { x:  0.0, z:  2.50, radius: 1.6, model: 'assets/models/room_display.glb' },
  gate:     { x: -3.8, z:  0.0,  radius: 1.5, model: 'assets/models/room_gate.glb' },
  rack:     { x: -3.8, z: -2.0,  radius: 1.4, model: 'assets/models/room_weapon_rack.glb' },
};
const PLACE = [
  ['room_shell',        [0, 0], 0, false],
  ['room_order_window', [-1.6, -3.45], 0],
  ['room_exchange',     [1.6, -3.45], 0],
  ['room_anvil_bench',  [3.15, 0.3], 0],
  ['room_furnace',      [4.0, 2.1], 0],
  ['room_display',      [0, 3.35], Math.PI],   // exported facing +z; turn its glass toward the room
  ['room_gate',         [-4.85, 0], Math.PI / 2],
  ['room_weapon_rack',  [-4.65, -2.0], Math.PI / 2],
  ['room_material_crate', [2.8, 0.9], 0],
];
const STRIKE = new THREE.Vector3(3.75, 1.2, 0.38);   // top of the anvil iron inside room_anvil_bench.glb
const FIRE_POS = new THREE.Vector3(4.0, 0.7, 1.65);   // refined by eye against the firebox

const roomReady = Promise.all(PLACE.map(p => loadRoom(...p))).then(() => {
  loadFire();
  buildColliders();
});
let fireObj = null;
function loadFire() {
  gltfLoader.load('assets/models/fire.glb', g => {
    const w = new THREE.Group();
    w.scale.z = MZ; w.add(g.scene);
    w.position.copy(FIRE_POS);
    scene.add(w);
    g.scene.traverse(o => { if (o.isMesh) { o.castShadow = false; if (o.material.emissiveIntensity > 1.1) o.material.emissiveIntensity = 1.1; } });
    fireObj = w;
  }, undefined, e => loadErrors.push('fire: ' + e.message));
}

/* ---------- colliders: AABBs from the loaded furniture (XZ), shell interior ---------- */
const colliders = [];
const INNER = { x0: -4.75, x1: 4.75, z0: -3.75, z1: 3.75 };
function buildColliders() {
  for (const n of ['room_order_window', 'room_exchange', 'room_anvil_bench', 'room_furnace', 'room_display',
                   'room_gate', 'room_weapon_rack', 'room_material_crate']) {
    const o = MODELS[n]; if (!o) continue;
    o.updateMatrixWorld(true);
    const b = new THREE.Box3().setFromObject(o);
    const g = 0.06;   // collide a touch inside the visuals so the tight gaps stay walkable
    colliders.push({ n, x0: b.min.x + g, x1: b.max.x - g, z0: b.min.z + g, z1: b.max.z - g });
  }
  // interior walls of the shell: every authored 24-vertex brick box that is neither an outer wall nor above head height
  MODELS.room_shell?.traverse(o => {
    if (!o.isMesh || o.material.name !== 'brick') return;
    const p = o.geometry.attributes.position, v = new THREE.Vector3();
    for (let i = 0; i + 24 <= p.count; i += 24) {
      const bb = new THREE.Box3();
      for (let k = 0; k < 24; k++) bb.expandByPoint(v.fromBufferAttribute(p, i + k).applyMatrix4(o.matrixWorld));
      if (bb.max.x - bb.min.x > 8 || bb.max.z - bb.min.z > 7.5 || bb.min.y > 1.8) continue;
      colliders.push({ n: 'shell_wall', x0: bb.min.x, x1: bb.max.x, z0: bb.min.z, z1: bb.max.z });
    }
  });
}

/* ---------- textures: kept for the sparks only; room textures live in the GLBs ---------- */

/* ---------- blade + hammer (recycled) ---------- */
const bladeMat = new THREE.MeshStandardMaterial({
  color: 0xa8aeb4, roughness: 0.50, metalness: 0.62, emissive: 0x000000, emissiveIntensity: 1
});
let bladeTpl = null;
function bladeClone(mat = bladeMat) {
  const m = bladeTpl.clone(true);
  m.traverse(o => { if (o.isMesh) o.material = mat; });
  return m;
}
const heldGroup = new THREE.Group();          // blade in hand (camera child)
heldGroup.position.set(-0.30, -0.26, -0.62);
camera.add(heldGroup);
const hammer = new THREE.Group();             // hammer in hand (camera child)
hammer.position.set(0.30, -0.30, -0.60);
camera.add(hammer);
const worldBlade = new THREE.Group();         // blade lying on the anvil while struck
scene.add(worldBlade);
worldBlade.visible = false;
const shelfBlades = [];                       // displayed
const rackBlades = [];

gltfLoader.load('assets/models/blade.glb', g => {
  const m = g.scene;
  const b = new THREE.Box3().setFromObject(m);
  const s = 0.98 / (b.max.x - b.min.x);
  m.scale.setScalar(s);
  m.rotation.x = -Math.PI / 2;               // lay it flat (plane XY -> XZ)
  bladeTpl = new THREE.Group(); bladeTpl.add(m);
  const hb = bladeClone();
  hb.rotation.set(0, Math.PI / 2 + 0.25, 0.9);   // point up and forward in the hand
  hb.scale.setScalar(0.62);
  heldGroup.add(hb);
  const wb = bladeClone();
  wb.rotation.y = 0.5;
  worldBlade.add(wb);
}, undefined, e => loadErrors.push('blade: ' + e.message));
gltfLoader.load('assets/models/hammer.glb', g => {
  const m = g.scene;
  const b = new THREE.Box3().setFromObject(m);
  const s = 0.36 / (b.max.y - b.min.y);
  m.scale.setScalar(s);
  const b2 = new THREE.Box3().setFromObject(m);
  m.position.set(-(b2.min.x + b2.max.x) / 2, -b2.min.y, -(b2.min.z + b2.max.z) / 2);
  m.traverse(o => { if (o.isMesh) o.castShadow = false; });
  hammer.add(m);
}, undefined, e => loadErrors.push('hammer: ' + e.message));
const HAM_REST = -0.30, HAM_HIT = 0.35;
hammer.rotation.set(0.2, 0.2, HAM_REST);
hammer.visible = false;

/* ---------- customer silhouette + bell at the order window ---------- */
const customer = new THREE.Group();
{
  const mat = new THREE.MeshStandardMaterial({ color: 0x0a0907, roughness: 1 });
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.30, 1.05, 10), mat);
  body.position.y = 0.58;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.15, 12, 10), mat);
  head.position.y = 1.32;
  customer.add(body, head);
  customer.position.set(-1.6, 0, -3.72);
  customer.visible = false;
  scene.add(customer);
}
const bell = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2),
  new THREE.MeshStandardMaterial({ color: 0xb08a3a, metalness: 0.9, roughness: 0.3, emissive: 0x402a08, emissiveIntensity: 0.6 }));
bell.position.set(-2.3, 0.24, -2.95);
scene.add(bell);

/* ---------- sparks ---------- */
const SPARKS = 220;
const sparkPos = new Float32Array(SPARKS * 3);
const sparkVel = new Float32Array(SPARKS * 3);
const sparkLife = new Float32Array(SPARKS);
for (let i = 0; i < SPARKS; i++) sparkPos[i * 3 + 1] = -50;
const sparkGeo = new THREE.BufferGeometry();
sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));
function dotTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grd.addColorStop(0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.22, 'rgba(255,226,170,0.92)');
  grd.addColorStop(0.55, 'rgba(255,140,40,0.35)');
  grd.addColorStop(1, 'rgba(255,90,10,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const sparks = new THREE.Points(sparkGeo, new THREE.PointsMaterial({
  color: 0xffc070, size: 0.035, transparent: true, opacity: 0.95, map: dotTexture(),
  blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true, alphaTest: 0.01
}));
sparks.frustumCulled = false;
scene.add(sparks);
let sparkHead = 0;
function burst(n, o, power = 1) {
  for (let k = 0; k < n; k++) {
    const i = sparkHead++ % SPARKS;
    sparkPos[i * 3] = o.x + (rand() - .5) * 0.10;
    sparkPos[i * 3 + 1] = o.y + (rand() - .5) * 0.03;
    sparkPos[i * 3 + 2] = o.z + (rand() - .5) * 0.10;
    const a = rand() * Math.PI * 2, up = 0.6 + rand() * 2.0 * power, sp = (0.5 + rand() * 1.9) * power;
    sparkVel[i * 3] = Math.cos(a) * sp; sparkVel[i * 3 + 1] = up; sparkVel[i * 3 + 2] = Math.sin(a) * sp * 0.7;
    sparkLife[i] = 1.0;
  }
  sparkHead %= SPARKS;
}
function updateSparks(dt) {
  let any = false;
  for (let i = 0; i < SPARKS; i++) {
    if (sparkLife[i] <= 0) continue;
    any = true;
    sparkLife[i] -= dt * 1.5;
    sparkVel[i * 3 + 1] -= 7.5 * dt;
    sparkPos[i * 3] += sparkVel[i * 3] * dt;
    sparkPos[i * 3 + 1] += sparkVel[i * 3 + 1] * dt;
    sparkPos[i * 3 + 2] += sparkVel[i * 3 + 2] * dt;
    if (sparkPos[i * 3 + 1] < 0.03) { sparkPos[i * 3 + 1] = 0.03; sparkVel[i * 3 + 1] *= -0.25; sparkVel[i * 3] *= 0.7; sparkVel[i * 3 + 2] *= 0.7; }
    if (sparkLife[i] <= 0) sparkPos[i * 3 + 1] = -50;
  }
  if (any) sparkGeo.attributes.position.needsUpdate = true;
}

/* ---------- audio ---------- */
const AUD = {};
for (const n of ['strike', 'hammer_whoosh', 'success', 'surge', 'shatter', 'damage', 'fire_loop',
                 'coin', 'select', 'ambient', 'purchase']) {
  const a = new Audio(`assets/sfx/${n}.mp3`);
  a.preload = 'auto';
  if (n === 'fire_loop' || n === 'ambient') { a.loop = true; a.volume = n === 'fire_loop' ? 0.16 : 0.13; }
  else a.volume = 0.55;
  AUD[n] = a;
}
const MUSIC = new Audio('assets/music/forge_theme.mp3');
MUSIC.loop = true; MUSIC.volume = 0.0; MUSIC.preload = 'auto';
let audioOn = false;
function startAudio() {
  if (audioOn) return;
  audioOn = true;
  AUD.fire_loop.play().catch(() => {});
  AUD.ambient.play().catch(() => {});
  MUSIC.play().then(() => { MUSIC.volume = 0.0; fadeTo(MUSIC, 0.20, 3.0); }).catch(() => {});
}
function fadeTo(a, v, secs) {
  const t0 = performance.now(), v0 = a.volume;
  const step = () => {
    const k = Math.min(1, (performance.now() - t0) / (secs * 1000));
    a.volume = v0 + (v - v0) * k;
    if (k < 1) requestAnimationFrame(step);
  };
  step();
}
const sfx = (n, vol = 1) => {
  const a = AUD[n]; if (!a) return;
  const c = a.cloneNode(); c.volume = Math.min(1, (a.volume || 0.55) * vol);
  c.play().catch(() => {});
};

/* ---------- game rules ---------- */
const GOLD_START = 500;
const MATERIAL_COST = 40;
const EXCHANGE_COST = 100;
const taxOf = () => 12;
const valueOf = tier => Math.round(120 * Math.pow(1.36, tier));
const ORDER_NAMES = ['short blade', 'long blade', 'broad blade', 'slim blade', 'hooked blade'];
function newOrder() {
  const req = ordersDone < 1 ? 1 : 1 + Math.floor(rand() * 3);      // tier wanted
  return { name: ORDER_NAMES[Math.floor(rand() * ORDER_NAMES.length)], req, pay: 260 + 90 * req };
}
let ordersDone = 0;

const S = {
  phase: Q.has('autostart') ? 'play' : 'title',
  pos: new THREE.Vector3(-0.6, 0, 0.2), yaw: 0.0, pitch: -0.08,
  traveled: 0,
  gold: GOLD_START, goldStart: GOLD_START,
  held: null,            // { name, tier, struck, heat }
  order: null,
  calib: false,          // exchange: next strike's band is widened
  displayed: 0, hung: 0,
  charging: false, charge: 0, zoneLo: 0.70, zoneHi: 0.86, chargeTime: 0.95,
  focus: false, outcome: null, shake: 0,
  t: 0, fps: 0, log: [],
  prompt: '', toast: '', toastT: 0, near: null,
};

function setZone() {
  const t = S.held ? S.held.tier : 0;
  let width = clamp(0.185 - 0.007 * t, 0.100, 0.21);
  if (S.held) width *= 0.8 + 0.4 * S.held.heat;
  if (S.calib) width *= 1.9;
  const lo = clamp(0.66 + 0.008 * t, 0.66, 0.78);
  S.zoneLo = lo; S.zoneHi = clamp(lo + width, 0, 1.0);
  S.chargeTime = clamp(0.80 + 0.042 * t, 0.80, 1.30);
  gband.style.left = (S.zoneLo * 100) + '%';
  gband.style.width = ((S.zoneHi - S.zoneLo) * 100) + '%';
}

function outcomeWeights(tier, focused) {
  const t = clamp(tier, 0, 12);
  let w = { shatter: 0.035 + 0.016 * t, damage: 0.090, hold: 0.130, surge: 0.085 + 0.006 * t, rise: Math.max(0.22, 0.58 - 0.016 * t) };
  if (focused) { w.shatter *= 0.45; w.damage *= 0.7; w.surge *= 1.30; }
  const sum = Object.values(w).reduce((a, b) => a + b, 0);
  for (const k in w) w[k] /= sum;
  return w;
}
function roll(tier, focused) {
  const w = outcomeWeights(tier, focused);
  let r = rand(), acc = 0;
  for (const k of ['shatter', 'damage', 'hold', 'surge', 'rise']) { acc += w[k]; if (r <= acc) return k; }
  return 'rise';
}

/* ---------- UI ---------- */
const el = id => document.getElementById(id);
const ui = { title: el('title'), hint: el('hint'), corner: el('corner'), gold: el('gold'), order: el('order'),
             heldTag: el('heldTag'), prompt: el('prompt'), toast: el('toast'), flash: el('flash'),
             gauge: el('gauge'), gcur: el('gcur') };
const gband = el('gband');
function flash(v = 0.5, ms = 130) {
  ui.flash.style.transition = 'none'; ui.flash.style.opacity = String(v);
  requestAnimationFrame(() => { ui.flash.style.transition = `opacity ${ms}ms ease-out`; ui.flash.style.opacity = '0'; });
}
function say(msg) { S.toast = msg; S.toastT = 2.4; }
function updateReadouts() {
  ui.gold.textContent = S.gold.toLocaleString();
  ui.order.textContent = S.order ? `order: ${S.order.name} +${S.order.req} → ${S.order.pay}g` : 'order: —';
  ui.heldTag.textContent = S.held
    ? `holding ${S.held.struck ? 'blade' : 'bar'} +${S.held.tier} · heat ${Math.round(S.held.heat * 100)}%` + (S.calib ? ' · tonic' : '')
    : (S.calib ? 'tonic ready' : '');
}

/* ---------- input ---------- */
const keys = new Set();
const tapped = new Set();
let locked = false;
addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (!e.repeat) { keys.add(e.code); tapped.add(e.code); }
  if (e.code === 'KeyR') restart();
  startAudio();
});
addEventListener('keyup', e => keys.delete(e.code));
renderer.domElement.addEventListener('click', () => {
  startAudio();
  if (S.phase === 'title') beginPlay();
  renderer.domElement.requestPointerLock?.();
});
document.addEventListener('pointerlockchange', () => { locked = document.pointerLockElement === renderer.domElement; });
addEventListener('mousemove', e => {
  if (!locked) return;
  S.yaw -= e.movementX * 0.0022;
  S.pitch = clamp(S.pitch - e.movementY * 0.0022, -1.2, 1.2);
});

function beginPlay() {
  S.phase = 'play'; ui.title.style.opacity = '0'; ui.corner.style.opacity = '1';
}
function restart() {
  seed = +(Q.get('seed') || 1); for (let i = 0; i < 37; i++) rand();
  ordersDone = 0;
  S.gold = GOLD_START; S.held = null; S.order = null; S.calib = false; S.displayed = 0; S.hung = 0;
  S.charging = false; S.charge = 0; S.outcome = null; S.focus = false; S.traveled = 0;
  S.pos.set(-0.6, 0, 0.2); S.yaw = 0; S.pitch = -0.08;
  S.log = [];
  for (const b of shelfBlades.concat(rackBlades)) scene.remove(b);
  shelfBlades.length = 0; rackBlades.length = 0;
  S.phase = Q.has('autostart') ? 'play' : 'title';
  ui.title.style.opacity = S.phase === 'title' ? '1' : '0';
  ui.corner.style.opacity = S.phase === 'title' ? '0' : '1';
  updateReadouts();
}

/* ---------- interaction engine (distance is judged here, never by the caller) ---------- */
const distTo = z => Math.hypot(S.pos.x - ZONES[z].x, S.pos.z - ZONES[z].z);
const inZone = z => distTo(z) <= ZONES[z].radius;
function logAct(action, zone) {
  S.log.push({ action, zone, dist: +distTo(zone).toFixed(3), t: +S.t.toFixed(2) });
}

// what E would do right now (null when nothing is in reach)
function availableAction() {
  const h = S.held;
  if (inZone('order')) {
    if (!S.order && !h) return { action: 'accept', zone: 'order', label: 'E — hear the order' };
    if (S.order && h && h.struck) {
      return h.tier >= S.order.req
        ? { action: 'deliver', zone: 'order', label: `E — deliver for ${S.order.pay + 90 * (h.tier - S.order.req)}g` }
        : { action: 'noop', zone: 'order', label: `the order wants +${S.order.req} (this is +${h.tier})` };
    }
  }
  if (inZone('craft') && !h && S.order) return { action: 'pickup', zone: 'craft', label: `E — take an iron bar (${MATERIAL_COST}g)` };
  if (inZone('forge') && h) return { action: 'heat', zone: 'forge', label: 'E — heat in the furnace' };
  if (inZone('exchange') && !S.calib) return { action: 'exchange', zone: 'exchange', label: `E — buy a steadying tonic (${EXCHANGE_COST}g)` };
  if (inZone('display') && h && h.struck) return { action: 'display', zone: 'display', label: `E — display & sell (${Math.round(valueOf(h.tier) * 0.8)}g)` };
  if (inZone('rack') && h && h.struck) return { action: 'hang', zone: 'rack', label: 'E — hang on the rack' };
  if (inZone('gate')) return { action: 'noop', zone: 'gate', label: 'the gate is chained shut' };
  if (inZone('craft') && h) return { action: 'noop', zone: 'craft', label: h.heat >= 0.2 ? 'hold SPACE — strike' : 'too cold — heat it first' };
  return null;
}

function interact() {
  const a = availableAction();
  if (!a || a.action === 'noop') { if (a) say(a.label); return; }
  const h = S.held;
  switch (a.action) {
    case 'accept':
      S.order = newOrder();
      customer.visible = true;
      sfx('select', 0.8); say(`order: ${S.order.name} +${S.order.req}`);
      break;
    case 'pickup':
      if (S.gold < MATERIAL_COST) { say('not enough gold'); return; }
      S.gold -= MATERIAL_COST;
      S.held = { name: S.order.name, tier: 0, struck: 0, heat: 0 };
      sfx('purchase', 0.7); say('iron bar taken');
      break;
    case 'heat':
      h.heat = 1.0; sfx('select', 1.0); flash(0.10, 320);
      burst(20, new THREE.Vector3(3.6, 1.1, 1.5), 0.7);
      say('glowing');
      break;
    case 'exchange':
      if (S.gold < EXCHANGE_COST) { say('not enough gold'); return; }
      S.gold -= EXCHANGE_COST; S.calib = true; sfx('purchase', 0.9); say('next strike: wider band');
      setZone();
      break;
    case 'deliver': {
      const pay = S.order.pay + 90 * (h.tier - S.order.req);
      S.gold += pay; S.held = null; S.order = null; ordersDone++;
      customer.visible = false;
      sfx('coin', 1.0); flash(0.12, 260); say(`delivered · +${pay}g`);
      break;
    }
    case 'display': {
      const v = Math.round(valueOf(h.tier) * 0.8);
      S.gold += v; S.held = null; S.displayed++;
      addShelfBlade(h.tier);
      sfx('coin', 0.9); say(`sold from the cabinet · +${v}g`);
      break;
    }
    case 'hang':
      S.held = null; S.hung++;
      addRackBlade();
      sfx('select', 0.9); say('hung on the rack');
      break;
  }
  logAct(a.action, a.zone);
  updateReadouts();
}

function addShelfBlade(tier) {
  if (!bladeTpl) return;
  const mat = new THREE.MeshStandardMaterial({ color: 0xb9bcc2, roughness: 0.34, metalness: 0.85,
    emissive: 0xffb060, emissiveIntensity: Math.min(0.8, tier * 0.12) });
  const b = bladeClone(mat);
  b.scale.setScalar(0.6);
  b.position.set(-0.65 + (S.displayed - 1) % 3 * 0.65, 0.40, 3.18);
  const old = shelfBlades[(S.displayed - 1) % 3];
  if (old) scene.remove(old);
  scene.add(b); shelfBlades[(S.displayed - 1) % 3] = b;
}
function addRackBlade() {
  if (!bladeTpl) return;
  const b = bladeClone();
  b.rotation.y = Math.PI / 2;
  b.position.set(-4.50, 1.85 + 0.0, -2.0 - 0.5 + (rackBlades.length % 3) * 0.5);
  b.rotation.z = 0.0;
  scene.add(b); rackBlades.push(b);
}

/* ---------- strike (hold space near the anvil, release in the band) ---------- */
function tryStartCharge() {
  if (S.charging || S.outcome || !S.held) return;
  if (!inZone('craft')) return;
  if (S.held.heat < 0.2) { say('too cold — heat it first'); return; }
  if (S.gold < taxOf()) { say('not enough gold'); return; }
  S.charging = true; S.charge = 0; S.focus = false;
  setZone();
  sfx('hammer_whoosh', 0.55);
}
function releaseCharge() {
  if (!S.charging) return;
  S.charging = false;
  if (!inZone('craft')) { say('you stepped away'); return; }
  const inBand = S.charge >= S.zoneLo && S.charge <= S.zoneHi;
  const late = S.charge > S.zoneHi;
  S.focus = inBand;
  S.gold = Math.max(0, S.gold - taxOf());
  S.outcome = { kind: roll(S.held.tier, inBand), t: 0, struck: false };
  S.calib = false;
  S.shake = late ? 0.5 : 1.0;
  logAct('strike', 'craft');
  updateReadouts();
}
function applyOutcome() {
  const o = S.outcome, b = S.held;
  if (!o || !b) return;
  b.struck++;
  b.heat = Math.max(0.2, b.heat - 0.05);
  if (o.kind === 'rise') { b.tier = Math.min(14, b.tier + 1); sfx('success', 1.0); flash(0.16, 200); say('rise'); }
  else if (o.kind === 'surge') { b.tier = Math.min(14, b.tier + 2 + (rand() < 0.4 ? 1 : 0)); sfx('surge', 1.0); flash(0.30, 380); S.surgedAt = S.t; say('SURGE'); }
  else if (o.kind === 'hold') { sfx('damage', 0.35); flash(0.07, 120); say('held'); }
  else if (o.kind === 'damage') { b.tier = Math.max(0, b.tier - 1); sfx('damage', 1.0); flash(0.16, 200); say('damaged'); }
  else if (o.kind === 'shatter') { sfx('shatter', 1.0); flash(0.5, 260); burst(60, STRIKE, 1.6); S.held = null; say('shattered — take another bar'); }
  S.outcome = { ...o, done: true, t: 0 };
  setZone();
  updateReadouts();
}

/* ---------- movement + collision ---------- */
const PR = 0.22;
function blocked(x, z) {
  if (x < INNER.x0 + PR || x > INNER.x1 - PR || z < INNER.z0 + PR || z > INNER.z1 - PR) return true;
  for (const c of colliders) {
    const nx = clamp(x, c.x0, c.x1), nz = clamp(z, c.z0, c.z1);
    if ((x - nx) ** 2 + (z - nz) ** 2 < PR * PR) return true;
  }
  return false;
}
function move(dt) {
  const turn = 1.7 * dt;
  if (keys.has('ArrowLeft')) S.yaw += turn;
  if (keys.has('ArrowRight')) S.yaw -= turn;
  if (keys.has('ArrowUp')) S.pitch = clamp(S.pitch + turn * 0.8, -1.2, 1.2);
  if (keys.has('ArrowDown')) S.pitch = clamp(S.pitch - turn * 0.8, -1.2, 1.2);
  let f = 0, r = 0;
  if (keys.has('KeyW')) f += 1;
  if (keys.has('KeyS')) f -= 1;
  if (keys.has('KeyD')) r += 1;
  if (keys.has('KeyA')) r -= 1;
  if (!f && !r) return;
  const len = Math.hypot(f, r);
  const sp = 2.6 * dt / len;
  const sy = Math.sin(S.yaw), cy = Math.cos(S.yaw);
  // forward = (-sin yaw, -cos yaw); right = (cos yaw, -sin yaw)
  const dx = (-sy * f + cy * r) * sp, dz = (-cy * f - sy * r) * sp;
  const ox = S.pos.x, oz = S.pos.z;
  if (!blocked(S.pos.x + dx, S.pos.z)) S.pos.x += dx;
  if (!blocked(S.pos.x, S.pos.z + dz)) S.pos.z += dz;
  S.traveled += Math.hypot(S.pos.x - ox, S.pos.z - oz);
}

/* ---------- camera ---------- */
const DEBUG_CAM = Q.get('cam');   // x,y,z,yaw,pitch
const TOPVIEW = Q.has('top');
function updateCamera(dt) {
  if (TOPVIEW) {
    camera.position.set(0, 9, 0.001); camera.rotation.set(-Math.PI / 2, 0, 0, 'YXZ');
    return;
  }
  if (DEBUG_CAM) {
    const v = DEBUG_CAM.split(',').map(Number);
    camera.position.set(v[0], v[1], v[2]); camera.rotation.set(v[4] || 0, v[3] || 0, 0, 'YXZ');
    return;
  }
  const bob = S.moving ? Math.sin(S.t * 9) * 0.012 : 0;
  camera.position.set(S.pos.x, 1.62 + bob, S.pos.z);
  camera.rotation.set(S.pitch, S.yaw, 0, 'YXZ');
  if (S.shake > 0.001) {
    const s = S.shake * 0.02;
    camera.position.x += (rand() - .5) * s; camera.position.y += (rand() - .5) * s;
    S.shake *= Math.exp(-7 * dt);
  }
}

/* ---------- update ---------- */
let prevSpace = false;
function update(dt) {
  S.t += dt;
  const spaceDown = keys.has('Space');
  const spaceEdge = tapped.has('Space') || (spaceDown && !prevSpace);
  prevSpace = spaceDown;

  if (S.phase === 'title') {
    if (spaceEdge || tapped.has('Enter') || tapped.has('KeyE')) { beginPlay(); startAudio(); }
  } else {
    const px = S.pos.x, pz = S.pos.z;
    move(dt);
    S.moving = (S.pos.x !== px || S.pos.z !== pz);
    if (tapped.has('KeyE')) interact();

    // strike
    if (S.charging) {
      S.charge += dt / S.chargeTime;
      if (!spaceDown || S.charge > 1.28) releaseCharge();
    } else if (spaceEdge) tryStartCharge();

    // heat decays
    if (S.held && S.held.heat > 0) S.held.heat = Math.max(0, S.held.heat - dt / 45);
  }
  tapped.clear();

  // outcome timeline
  if (S.outcome) {
    S.outcome.t += dt;
    if (!S.outcome.struck && S.outcome.t > 0.16) {
      S.outcome.struck = true; sfx('strike', 1.0); burst(46, STRIKE, 1.0); S.shake = Math.max(S.shake, 0.9);
    }
    if (!S.outcome.done && S.outcome.t > 0.62) applyOutcome();
    if (S.outcome.done && S.outcome.t > 1.0) { S.outcome = null; updateReadouts(); }
  }

  // hammer + held blade view-models
  const nearBench = inZone('craft');
  hammer.visible = !!S.held && nearBench;
  heldGroup.visible = !!S.held && !(S.outcome && !S.outcome.done && S.held);
  worldBlade.visible = !!S.held && !!S.outcome && nearBench;
  worldBlade.position.set(STRIKE.x, STRIKE.y + 0.02, STRIKE.z);
  if (S.charging) {
    hammer.rotation.z = damp(hammer.rotation.z, HAM_REST - clamp(S.charge, 0, 1.2) * 0.35, 12, dt);
  } else if (S.outcome && S.outcome.t < 0.42) {
    const k = clamp(S.outcome.t / 0.42, 0, 1);
    hammer.rotation.z = HAM_REST + (HAM_HIT - HAM_REST) * Math.sin(Math.pow(k, 0.5) * Math.PI * 0.5);
  } else hammer.rotation.z = damp(hammer.rotation.z, HAM_REST, 5.5, dt);

  // blade glow: heat + tier
  if (S.held) {
    const surgeAge = S.surgedAt ? S.t - S.surgedAt : 99;
    if (surgeAge < 2.2) {
      bladeMat.emissive.setHSL((S.t * 0.9) % 1, 0.85, 0.62);
      bladeMat.emissiveIntensity = (1 - surgeAge / 2.2) * 2.0 + 0.4;
    } else {
      bladeMat.emissive.setRGB(1.0, 0.45 + 0.3 * (1 - S.held.heat), 0.15);
      bladeMat.emissiveIntensity = S.held.heat * 0.7 + Math.min(0.4, S.held.tier * 0.04);
    }
  }
  if (S.moving || S.held) updateReadouts();

  // fire flicker
  fireLight.intensity = 20 + Math.sin(S.t * 9.3) * 2.5 + Math.sin(S.t * 21.7) * 1.2;
  if (fireObj) fireObj.scale.y = 1 + Math.sin(S.t * 7.7) * 0.06;
  customer.position.y = Math.sin(S.t * 1.7) * 0.01;
  updateSparks(dt);

  // prompts / gauge
  const a = S.phase === 'play' ? availableAction() : null;
  S.near = a ? a.zone : null;
  S.prompt = a ? a.label : '';
  ui.prompt.textContent = S.prompt;
  ui.prompt.style.opacity = S.prompt ? '0.92' : '0';
  S.toastT = Math.max(0, S.toastT - dt);
  ui.toast.textContent = S.toast;
  ui.toast.style.opacity = S.toastT > 0 ? '1' : '0';
  ui.gauge.style.opacity = S.charging ? '1' : '0';
  ui.gcur.style.left = (clamp(S.charge, 0, 1) * 100) + '%';
  ui.hint.textContent = S.phase === 'title'
    ? 'space to begin'
    : 'WASD move · mouse / arrows look · E use · SPACE strike · R restart';
}

/* ---------- main loop ---------- */
const clock = new THREE.Clock();
let fpsAcc = 0, fpsN = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), 1 / 20);
  update(dt);
  updateCamera(dt);
  grade.uniforms.uTime.value += dt;
  composer.render();
  fpsAcc += dt; fpsN++;
  if (fpsAcc > 0.5) { S.fps = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0; }
  requestAnimationFrame(frame);
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

/* ---------- state contract ---------- */
window.__game = {
  get loaded() {
    const out = {};
    for (const [k, o] of Object.entries(MODELS)) {
      const b = new THREE.Box3().setFromObject(o);
      out[k] = { min: b.min.toArray().map(v => +v.toFixed(2)), max: b.max.toArray().map(v => +v.toFixed(2)) };
    }
    return { count: Object.keys(MODELS).length, errors: loadErrors, boxes: out };
  },
  get state() {
    const h = S.held;
    return {
      fps: S.fps, phase: S.phase,
      gold: S.gold, goldStart: S.goldStart, ordersCompleted: ordersDone,
      player: { x: +S.pos.x.toFixed(3), z: +S.pos.z.toFixed(3), yaw: +S.yaw.toFixed(3), pitch: +S.pitch.toFixed(3), traveled: +S.traveled.toFixed(3) },
      held: h ? { name: h.name, tier: h.tier, struck: h.struck, heat: +h.heat.toFixed(2) } : null,
      order: S.order ? { ...S.order } : null,
      zones: ZONES,
      near: S.near, prompt: S.prompt,
      charging: S.charging, charge: +S.charge.toFixed(3), cursor: +clamp(S.charge, 0, 1).toFixed(3),
      zoneLo: +S.zoneLo.toFixed(3), zoneHi: +S.zoneHi.toFixed(3),
      focus: S.focus, outcome: S.outcome ? S.outcome.kind : null, outcomeDone: !!(S.outcome && S.outcome.done),
      calib: S.calib, displayed: S.displayed, hung: S.hung,
      interactLog: S.log, t: +S.t.toFixed(2),
    };
  }
};

setZone();
restart();
if (Q.has('autostart')) ui.corner.style.opacity = '1';
frame();
</script>
</body>
</html>
